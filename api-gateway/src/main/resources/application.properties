spring.application.name=api-gateway
server.port=8080

# Eureka - where to find the registry
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Route 1: Product API
spring.cloud.gateway.mvc.routes[0].id=product-api
spring.cloud.gateway.mvc.routes[0].uri=lb://product-api
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/products/**

# Route 2: Order API
spring.cloud.gateway.mvc.routes[1].id=order-api
spring.cloud.gateway.mvc.routes[1].uri=lb://order-api
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/orders/**